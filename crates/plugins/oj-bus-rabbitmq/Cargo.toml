[package]
name = "oj-bus-rabbitmq"
version = "0.1.0"
edition = "2024"
description = "bus 轴 rabbitmq cdylib 插件：lapin 迁自 core broker/rabbitmq.rs（Task 4.3）"

[lib]
crate-type = ["cdylib"]

[dependencies]
oj-plugin-ffi = { path = "../../../oj-plugin-ffi" }
futures = "0.3"
lapin = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "time", "macros"] }
