[package]
name = "oj-kv-redis"
version = "0.1.0"
edition = "2024"
description = "kv 轴 redis cdylib 插件：RedisKV 迁自 core kv.rs（Task 4.4）"

[lib]
crate-type = ["cdylib"]

[dependencies]
oj-plugin-ffi = { path = "../../../oj-plugin-ffi" }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "time", "macros"] }
