[package]
name = "oj-cache" # 拷贝模板后改成你的插件名（oj-<axis> 惯例）
version = "0.1.0"
edition = "2024"
description = "泛型轴插件开发模板：cache 轴（进程内 HashMap，仅作范式载体）"

[lib]
crate-type = ["cdylib"]

[dependencies]
oj-plugin-ffi = { path = "../../oj-plugin-ffi" }
serde_json = "1"

# 模板骨架：不进根 workspace members（拷贝使用）。空 [workspace] 使本 crate 自成
# workspace 根，避免「believes it's in a workspace when it's not」报错；
# 拷贝到你的仓库后若并入自己的 workspace，可删除本段并调整上方 path 依赖。
[workspace]
