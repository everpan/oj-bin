<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>oj desktop demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      button { font-size: 1rem; padding: .5rem 1rem; }
      pre { background: #111; color: #0f0; padding: 1rem; border-radius: 8px; white-space: pre-wrap; min-height: 4rem; }
