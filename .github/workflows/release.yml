# 发行打包 + GitHub Release（spec：docs/superpowers/specs/2026-09-01-release-packaging-design.md）
#
# 三平台矩阵各自调用 scripts/ 下的打包脚本（单一真相来源，本地与 CI 产物同形）：
#   ubuntu / macos -> bash scripts/deploy.sh     -> dist/oj-v<ver>-<triple>.tar.gz
#   windows        -> cmd  scripts\deploy.bat    -> dist/oj-v<ver>-<triple>.zip
#
# 全部以 --release 构建（无 debug 构建，见 CLAUDE.md）。
#
# 触发：
#   - 打 tag 推送（v*）自动发布正式 Release
#   - 手工 workflow_dispatch（默认发布为草稿，人工核对后再点发布）
#
# 矩阵与 .github/workflows/plugin-matrix.yml 保持一致；musl 行按需启用。

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（如 v0.1.0）；留空则用 v + oj/Cargo.toml 的 version'
        required: false
      draft:
        description: '发布为草稿（true = 人工核对产物后再点发布）'
        required: false
        default: 'true'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # 格式与 lint 门禁（CLAUDE.md：CI 使用 -D warnings）。平台无关，单实例跑一次即可，
  # 不放进三平台矩阵重复执行。
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --workspace --all-targets -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  package:
    needs: [lint]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gnu (x86_64-unknown-linux-gnu)
            os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            # 同 plugin-matrix.yml：V8 terminate_execution 后的 isolate 析构曾在某些平台
            # SIGSEGV。按平台开关控制是否跳过 infinite_loop，默认跑全量（不再全局跳过）。
            skip_infinite_loop: false
          - name: macos (aarch64-apple-darwin)
            os: macos-latest
            triple: aarch64-apple-darwin
            skip_infinite_loop: false
          - name: windows (x86_64-pc-windows-msvc)
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            skip_infinite_loop: false
          # 按需：部署含 Alpine 时启用 musl 行
          # - name: linux-musl (x86_64-unknown-linux-musl)
          #   os: ubuntu-latest
          #   triple: x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Windows 上 rdkafka-sys（oj-bus-kafka 的依赖）经 cmake 从源码编 librdkafka。
      # 镜像只装 VS2026，cmake 3.29 不认识其 "Visual Studio 18 2026" 生成器；若改钉
      # VS2022 又找不到实例。故改用 NMake Makefiles 生成器（与 VS 版本解耦），并由
      # msvc-dev-cmd 注入 MSVC 工具链（cl/nmake 入 PATH），避免生成器名与 cmake
      # 版本错配 → "Could not create named generator" / "could not find instance"。
      - name: Set up MSVC toolchain (cl/nmake) for rdkafka-sys cmake build
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Pin cmake generator for rdkafka-sys (NMake, version-agnostic)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "CMAKE_GENERATOR=NMake Makefiles" >> "$GITHUB_ENV"

      # Git for Windows 自带 GNU `link.exe`（usr/bin），会在 MSVC 的 link.exe 之前被 rustc
      # 选中，导致链接失败（"missing operand after ..."）。构建前移除该冲突文件，
      # 让 rustc 落到 msvc-dev-cmd 注入的 MSVC link.exe。
      - name: Remove Git's link.exe (shadows MSVC linker)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: rm -f "/c/Program Files/Git/usr/bin/link.exe"

      # rdkafka-sys 经 cmake 编 librdkafka 默认 /MD（动态 CRT），而 rustc
      # windows-msvc 默认静态 CRT（libcmt）→ 混链 1120（__imp__* 符号悬空）。
      # 在 cl.exe 层面覆盖：_CL_ 由 cl 追加在完整命令行末尾，同类别旗标后者胜。
      # 必须用 dash 形式 -MT（MSVC 两种前缀都认）：slash 形式 /MT 会被 MSYS
      # （shell: bash）当 POSIX 绝对路径转换成 "C:/Program Files/Git/MT"，
      # cl 视之为源文件 → C1083（CI 实测踩坑）。
      - name: Force static CRT for librdkafka (cl-level _CL_ override)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "_CL_=-MT" >> "$GITHUB_ENV"

      # 先构建并归置全部插件，再跑 workspace 测试：oj/tests/oidc_e2e.rs 运行期从
      # bin/plugins/<triple>/ dlopen oj-auth——fresh checkout 上若先跑测试，装配层
      # 会 fail-fast（"config declares [auth] but no auth plugin loaded"）。
      # 与 plugin-matrix.yml 同序；下方打包脚本内的 xtask build 二次执行是 no-op。
      - name: build & place plugins
        shell: bash
        run: |
          cargo run --release -p xtask -- build
          ls -la bin/plugins/${{ matrix.triple }}/

      # 发行门禁（v0.1.12）：源文件缺席冒烟——把构建机才有的 JS 源临时改名后，暂存
      # 二进制必须仍能完成 `oj build`。deno_core 0.411 的 dir 形式曾把扩展 JS 绝对
      # 路径烧进二进制，非构建机上 JsRuntime 初始化即 ENOENT。打包脚本
      # （deploy.sh / deploy.bat）内亦调用同一命令；此处显式执行以便 CI 留痕。
      - name: release gate (off-build-machine smoke)
        shell: bash
        run: |
          bin="bin/oj"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then bin="bin/oj.exe"; fi
          cargo run --release -p xtask -- smoke --bin "$bin"

      # 发布前跑全量测试（release 模式，与 plugin-matrix 同；infinite_loop 在部分平台会
      # SIGSEGV，跳过）。
      - name: cargo test --release (workspace, skip infinite_loop)
        run: cargo test --workspace --release -- --skip infinite_loop

      # 打包：调用 scripts/ 下与本地同款的脚本（脚本内自带 cargo xtask build）。
      - name: package (unix)
        if: matrix.os != 'windows-latest'
        run: bash scripts/deploy.sh
      # Windows 走 bat（cmd.exe）。必须显式 shell: cmd —— windows runner 的默认
      # shell 是 pwsh，.bat 在 pwsh 下不会被 cmd 解释。
      - name: package (windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: call scripts\deploy.bat

      - name: list package
        shell: bash
        run: ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 三平台产物合并到同一目录（各平台文件名含 triple，不会互相覆盖）。
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: resolve tag
        id: tag
        run: |
          cargo_version=$(awk -F'"' '/^version =[[:space:]]*"/ { print $2; exit }' oj/Cargo.toml)
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="v${cargo_version}"
          fi
          # 版本一致性门禁：tag 必须与 oj/Cargo.toml 的 version 对得上，否则会发出
          # 「tag v0.2.0 里装着 0.1.0 的包」这种产物。
          if [ "${tag#v}" != "$cargo_version" ]; then
            echo "::error::tag '${tag}' 与 oj/Cargo.toml 的 version '${cargo_version}' 不一致；先改 Cargo.toml 或换 tag" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "resolved tag: ${tag}"

      # 用 gh CLI（runner 预装、第一方）而非第三方 action：不引入额外供应链依赖。
      # GITHUB_TOKEN 在 permissions.contents=write 下可建 Release。
      # 幂等语义（仓库启用了 immutable releases：发布后的 release 资产不可删/换，
      # `gh release upload --clobber` 会 422 "Cannot delete asset from an immutable
      # release"，故按 release 状态分派）：
      #   - 不存在 → 创建（手工 dispatch + draft=true 发草稿；tag 推送直接正式版）
      #   - 是草稿 → 覆盖上传产物（草稿可变）；tag 推送时随推送转正
      #   - 已发布 → 产物不可改：三平台产物齐全即幂等成功（重跑场景）；缺失则报错，
      #     提示删除该 release 与 tag 后重跑
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            args=()
            # 手工触发且 draft=true 时发草稿；tag 推送直接发正式版。
            if [ "${{ github.event_name }}" != "push" ] && [ "${{ inputs.draft }}" = "true" ]; then
              args+=(--draft)
            fi
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              "${args[@]}" \
              dist/*
            exit 0
          fi
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
          if [ "$draft" != "true" ]; then
            missing=$(comm -13 \
              <(gh release view "$tag" --json assets --jq '.assets[].name' | sort) \
              <(cd dist && ls | sort))
            if [ -n "$missing" ]; then
              echo "::error::release $tag 已发布且缺产物：$(echo "$missing" | tr '\n' ' ')。immutable release 不可覆盖——删除该 release 与 tag 后重跑本 workflow" >&2
              exit 1
            fi
            echo "release $tag 已发布且产物齐全 → 幂等跳过"
            exit 0
          fi
          echo "release $tag 为草稿 → 覆盖上传产物"
          gh release upload "$tag" --clobber dist/*
          if [ "${{ github.event_name }}" = "push" ]; then
            gh release edit "$tag" --draft=false
            echo "草稿 $tag 已随 tag 推送转正"
          fi
