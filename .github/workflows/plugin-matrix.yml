# CI 平台矩阵（spec §4 产物归置）：宿主 release 可执行（oj）+ 全部第一方插件按目标平台
# 构建。宿主二进制入 `bin/<triple>/`，插件入 `bin/plugins/<triple>/`，与本地
# `cargo xtask plugin <name>` 同布局。全部以 --release 构建（无 debug 构建）。
# Linux 以 ubuntu 的 glibc 为基线；部署含 Alpine 时补 `x86_64-unknown-linux-musl` 行。

name: plugin-matrix

on:
  workflow_dispatch:

jobs:
  matrix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gnu (x86_64-unknown-linux-gnu)
            os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - name: macos (aarch64-apple-darwin)
            os: macos-latest
            triple: aarch64-apple-darwin
          - name: windows (x86_64-pc-windows-msvc)
            os: windows-latest
            triple: x86_64-pc-windows-msvc
          # 按需：部署含 Alpine 时启用 musl 行
          # - name: linux-musl (x86_64-unknown-linux-musl)
          #   os: ubuntu-latest
          #   triple: x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Windows 上 rdkafka-sys（oj-bus-kafka 的依赖）经 cmake 从源码编 librdkafka。
      # 镜像只装 VS2026，cmake 3.29 不认识其 "Visual Studio 18 2026" 生成器；若改钉
      # VS2022 又找不到实例。故改用 NMake Makefiles 生成器（与 VS 版本解耦），并由
      # msvc-dev-cmd 注入 MSVC 工具链（cl/nmake 入 PATH），避免生成器名与 cmake
      # 版本错配 → "Could not create named generator" / "could not find instance"。
      - name: Set up MSVC toolchain (cl/nmake) for rdkafka-sys cmake build
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Pin cmake generator for rdkafka-sys (NMake, version-agnostic)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "CMAKE_GENERATOR=NMake Makefiles" >> "$GITHUB_ENV"

      # musl 行启用时：
      # - run: rustup target add x86_64-unknown-linux-musl
      #   且构建以 `cargo build -p oj-<name> --release --target x86_64-unknown-linux-musl`。

      # 宿主 + 全部第一方插件单测（release 模式，避免 debug 构建；infinite_loop 在部分平台会 SIGSEGV，跳过）。
      - name: cargo test --release (workspace, skip infinite_loop)
        run: cargo test --workspace --release -- --skip infinite_loop

      # 宿主 release 可执行（oj），与插件同 triple 构建，随产物一并上传。
      - name: build host release binary (oj)
        run: cargo build --release -p oj
      - name: place host binary
        shell: bash
        run: |
          mkdir -p "bin/${{ matrix.triple }}"
          cp "target/release/oj${{ (matrix.os == 'windows-latest' && '.exe') || '' }}" "bin/${{ matrix.triple }}/"

      # 第一方插件逐个 release 构建并拷入 bin/plugins/<triple>/（xtask 即 CI 产物入口）。
      - name: build & place plugins
        shell: bash
        run: |
          for p in es db-mysql db-postgres blob-s3 bus-kafka bus-rabbitmq kv-redis; do
            cargo run --release -p xtask -- plugin "$p"
          done
          ls -la bin/plugins/${{ matrix.triple }}/

      # 产物归置（供发布/下载）：宿主二进制与插件各自按 triple 上传，布局与发行同形。
      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.triple }}
          path: bin/${{ matrix.triple }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.triple }}
          path: bin/plugins/${{ matrix.triple }}/
          if-no-files-found: error
