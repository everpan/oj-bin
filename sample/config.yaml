server:
  host: "localhost"
  port: 9778
  api_prefix: "/v1/api"   # API 基础路由前缀（CLI -b 显式给出时覆盖；旧键名 base 仍兼容）
  # app_prefix: "/"       # 静态站点前缀（默认 / = 全路径兜底）；如 "/site" 则仅 /site/* 落静态
  # migrate_on_start: auto   # 迁移门禁（§4.6）：auto（dev 默认，启动即应用）|
                     # verify（release 默认，账本落后拒启，先 oj migrate）| off
  # ownership_guard: warn    # 表归属守卫（§5.3）：warn（默认，跨模块表访问仅告警）|
                     # deny（未声明 deps 的跨模块表访问拒绝执行）。
                     # sample 各模块 tables/deps 已声明齐（oj build --check 全绿），
                     # 演示取 deny：跨模块取数必须显式 deps（P3 评估结论）。
  ownership_guard: deny
  app_path: "dist"   # 静态站点根（相对本文件目录；省略 = 不开静态服务；CLI --app-path 可覆盖）
  # app_spa_fallback: false   # v0.1.20：SPA 单页回落（默认 false）——开启后，未命中文件的
                     #  无扩展名 HTML 请求（Accept 含 text/html 或缺失）回落到 index.html，
                     #  深链刷新可用；API 前缀（api_prefix/app_prefix）下的 404 不受影响。
  # html_meta: "__meta"       # v0.1.20：每路由 HTML 元信息目录名（相对 app_path；默认关闭）。
                     #  开启后请求 /a/b/ 时读 <app_path>/__meta/a/b.json 注入 <title> 等；
                     #  该目录自身不对外公开（直接访问返回 404）。
  # logs_dir: "logs"   # 日志目录（终端输出镜像落盘；文件名 server-<启动秒>_<pid>.log）
  # logs_max_m: 100            # 单个日志文件大小上限（单位 M，<100 按 100 生效），超过滚动
  # logs_keep_files: 10        # 日志文件保留个数（含活动文件，超出删除）
                     #  绝对路径直接用；相对路径相对本文件目录；省略 = 本文件目录下 ./logs
  # console_log: false         # 终端输出（默认 false = 只落盘；true = 额外回写终端，
                     #  CLI --console-log 同效，与配置取「或」）。日志级别另由
                     #  RUST_LOG 环境变量控制（如 RUST_LOG=oj=debug），配置里不能配。
  # 证书必配（无逃生口）：不配两个路径即启动报错。此处为示例自签证书（有效期 1 年，
  # 私钥仅示例用，勿用于生产）；生产用 `tools/oj-cert` 生成并妥善保管私钥。
  public_key_path: "./config/public.pem"
  certificate_path: "./config/cert.jws"
db:
  default: "sqlite://db.sqlite"
  test: "sqlite://db_test.sqlite"
  # 多库混用（v0.2）：mysql/postgres DSN 原样透传，按名 DB("name") 取用。
  # analytics: "mysql://user:pass@127.0.0.1:3306/app"
  # warehouse: "postgres://127.0.0.1:5432/app"

# db_query:   # v0.1.20：构造器查询的 LIMIT 策略（仅顶层查询；硬顶 100000）
#   default_limit: 100   # 未显式 .limit() 时的隐式上限（默认 100；0 或 >max_limit 启动报错）
#   max_limit: 1000      # 显式 .limit(n) 的 clamp 上限（默认 1000；>100000 启动报错）
                         # 顶层结果行数 ≥ 生效上限时，响应带 X-OJ-Row-Limit 头提示可能被截断。

redis:
  # v0.2: 配置存在即真连 Redis（启动 fail-fast，连不上直接报错退出）；注释/删除 → 内存 KV。
  # 真连后 kv/redis 全局与 auth 会话共享同一 Redis（多实例水平扩展的前提）。
  # default: "redis://127.0.0.1:6379/1"

es:   # Elasticsearch（v0.2）：块存在即启用 es.search/index/del；endpoint 尾斜杠自动剪除
  # endpoint: "http://127.0.0.1:9200"

blob:   # 对象存储（v0.2）：块存在即启用——JS blob.* + {base}/blob/{key} 下载路由
  driver: "local"   # local | s3（s3: endpoint/bucket/region/access_key/secret_key 必配 bucket/region）
  root: "uploads"   # local 专用：存储根（相对本文件目录绝对化；需写权限）
  # s3 示例（MinIO path_style 需 true）：
  # driver: "s3"
  # endpoint: "http://127.0.0.1:9000"
  # bucket: "oj-blobs"
  # region: "us-east-1"
  # access_key: "minioadmin"
  # secret_key: "minioadmin"
  # path_style: true

smtp:   # 邮件投递（v0.1.19，需 oj-mail 插件）：段存在即启用 mail.* 全局
        # 一段两用：整段交 oj-mail 插件建 transport（host/port/tls/凭据只走插件、
        # 不进宿主）；宿主只取每个 profile 的 allowed_from/allowed_recipients 做前置
        # 白名单校验（**空表 = 拒绝**，fail-closed）与顶层的附件上限。
  workers: 4            # worker 线程数（省略 = 4；每个 worker 串行投递队列里的信）
  queue_capacity: 256   # 有界队列容量（满即背压 → 信封 code:4，不无界堆积；省略 = 256）
  # 附件上限（B2：宿主读盘后经有界队列持有，无上限即内存 DoS 面；省略 = 10 MiB / 25 MiB）
  max_attachment_bytes: 10485760        # 单附件上限（字节）
  max_total_attachment_bytes: 26214400  # 单封全部附件合计上限（字节）
  mock:                 # 键即 profile 名（= mail.send(key, …) 的 key；默认 profile 名 "default"）
    host: "localhost"   # file_transport 下不发网络，host/port 仅为满足插件 schema
    port: 25
    tls: none           # 明文须显式 allow_none_tls（fail-closed；本 profile 不联网）
    allow_none_tls: true
    mechanism: login
    file_transport: "/tmp/oj-mail-eml"   # 本地落盘通道：目录**须先存在**（mkdir -p /tmp/oj-mail-eml）
    allowed_from: ["noreply@x.com"]              # 发件人白名单（完整地址 = 全等匹配）
    allowed_recipients: ["@x.com"]               # 收件人白名单（@domain = 域全等；不含子域）
  # default:            # 真连 SMTP 的样例（示例值；凭据勿提交进仓库）
  #   host: "smtp.example.com"
  #   port: 465
  #   tls: tls          # tls（隐式 TLS）| starttls（强制升级）| none（须 allow_none_tls: true）
  #   mechanism: login  # login（user+pass）| xoauth2（user + xoauth2.access_token）
  #   user: "api@example.com"
  #   pass: "change-me"
  #   timeout: 30
  #   allowed_from: ["noreply@x.com"]
  #   allowed_recipients: ["@x.com", "@partner.com"]

tenant:   # 多租户注入（v0.2）：启用后请求必须带 header_key（缺失 → 400），值注入 http.tenantId
  enable: true
  header_key: "X-TENANT-ID"
  # allow_as_tenant: false       # v0.1.20：允许匿名请求用 db.asTenant(id) 声明身份
                                 # （仍强制租户条件；仅匿名且未带租户头的请求可用，默认关）
  anonymous_paths:               # 免租户头路径（OIDC 302 跳转腿带不了自定义头）
    # 通配四形态：字面 / /* 严格一层 / ** 跨任意层 / 中段 * 恰好一段。
    # 下面三条尾 /* 都只需一层（callback、jwks、discovery）；v0.1.20 启动会对「含尾 /*
    # 的列表」聚合打一条迁移 WARN（提示深路径改 **）——这里是预期提示、非配置错误。
    - "/oidc/*"
    - "/idp/*"
    - "/idp/.well-known/*"
    # WS 路由（<dir>/ws.ts）是 merge 进 Router 的真实路由，本就不经过这套
    # 前置管线（连接天然匿名）——无需也不会出现在 anonymous_paths 里。

auth:   # JWT 鉴权：oj-auth 插件守卫（验签/匿名）+ JS 端点（src/auth/，jwt 原语注入）
  jwt_secret: "change-me"        # 生产必改；空串启动 fail-fast
  signing_method: "HS256"        # HS256 | HS384 | HS512
  access_token_duration: "60s"   # access token 有效期（s/m/h/d）
  refresh_token_duration: "720h" # refresh session 有效期（轮换制）
  anonymous_paths:               # 免鉴权路径（去 /v1/api 前缀；通配四形态：字面 /
    - "/health"                  #   /* 严格一层 / ** 跨任意层 / 中段 * 恰好一段）
    - "/auth/login"              # auth 端点已是业务路由，须显式匿名
    - "/auth/refresh"
    - "/auth/logout"
    # WS 订阅路由（/news/ws）不在守卫面内（真实路由，不过前置管线）；
    # 发布 POST /news 保持鉴权（L1 news 套件钉住 401 语义）。
    - "/oidc/*"                  # 同上：尾 /* 严格一层，启动有聚合迁移 WARN（预期）
    - "/idp/*"
    - "/idp/.well-known/*"

tasks:   # 长任务池（v0.1.6）：dir 相对 API 目录；sample/src/tasks/task_demo.ts 每秒心跳
  dir: "tasks"
  max: 64
  stop_grace_secs: 30

kafkas:   # 命名 Kafka（v0.1.6）：值透传 oj-bus-kafka；配好 brokers 即可用 Kafka("default")
  # default:
  #   brokers: ["127.0.0.1:9092"]
  #   group: "sample"

rabbits:   # 命名 RabbitMQ（v0.1.6）：值透传 oj-bus-rabbitmq；RabbitMQ("default")
  # default:
  #   url: "amqp://guest:guest@127.0.0.1:5672"

oidc:   # OIDC（spec 2026-09-05）：同进程 OP + RP。demo 私钥与示例证书同性质，勿用于生产。
  issuer: "http://localhost:9778/v1/api/idp"
  private_key_path: "./config/oidc_rs256.pem"
  rp:   # RP：tenant → IdP。default 自举本机 OP；acme 留外部 IdP 样例（注释）。
    default:
      issuer: "http://localhost:9778/v1/api/idp"
      client_id: "sample-rp"
      client_secret: "rp-secret"
      scope: "openid profile"
    # acme:
    #   issuer: "https://idp.acme.example"
    #   client_id: "..."
    #   client_secret: "..."
  clients:   # OP 侧 client 白名单（redirect_uri 精确串）
    sample-rp:
      secret: "rp-secret"
      redirect_uris:
        - "http://localhost:9778/v1/api/oidc/callback"
      tenant: "default"
