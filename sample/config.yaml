server:
  host: "localhost"
  port: 9778
  base: "/v1/api"   # API 基础路由前缀（CLI -b 显式给出时覆盖）
  root: "dist"   # 静态站点根（相对本文件目录；省略 = 不开静态服务）
db:
  default: "sqlite://db.sqlite"
  test: "sqlite://db_test.sqlite"
  # 多库混用（v0.2）：mysql/postgres DSN 原样透传，按名 DB("name") 取用。
  # analytics: "mysql://user:pass@127.0.0.1:3306/app"
  # warehouse: "postgres://127.0.0.1:5432/app"

redis:
  default: "redis://127.0.0.1:6379/1"   # v0.1: warn + 内存 KV 模拟

tenant:   # 多租户注入（v0.2）：启用后请求必须带 header_key（缺失 → 400），值注入 http.tenantId
  enable: true
  header_key: "X-TENANT-ID"

auth:
  # Required
  jwt_secret: "change-me"
  auth_url: "https://..."  #external origin (falls back to request headers)
  db: "default"

  # Tokens
  signing_method: "HS256" # HS256 | HS384 | HS512
  access_token_duration: "60s"  # s / m / h / d / w / mo / y
  refresh_token_duration: "1y"

  # Web
  sign_in_redirect_url: "/sign-in"
  cookie_session_name: "cnf.id"
  cookies: # CookieOptions::default()

  # Storage
  redis: "default"  # optional in redis section
  redis_prefix: "AUTH-SESSION"
  redis_ttl: 1800
  user_table_name: "users"  # needs at least: id, roles
  session_table_name: "sessions"   # see examples/schema.sql

  # Providers & callbacks
  providers:
  resolve_user: # required for OAuth sign-in
  on_provider_connect: #
