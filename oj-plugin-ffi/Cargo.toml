[package]
name = "oj-plugin-ffi"
version = "0.1.0"
edition = "2024"

[dependencies]
# 剥除 Windows verbatim 前缀（\\?\）：canonicalize 结果拼进 sqlite DSN 前必须先简化
# （unix 上为 no-op）。宿主与插件共用 path_util::sqlite_file_dsn。
dunce = "1"
paste = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stabby = "72"
# 仅用于提供跨边界安全（catch_unwind 包裹）的 FfiFuture 工厂；与宿主侧 tokio 同版本。
tokio = { version = "1", features = ["rt", "sync"] }
