[package]
name = "oj"
version = "0.1.0"
edition = "2024"

[dependencies]
mdm-base-rust = { path = ".." }
mdm-server = { path = "../server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tar = "0.4"
flate2 = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json"] }
