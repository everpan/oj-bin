[package]
name = "oj"
version = "0.1.2"
edition = "2024"

[dependencies]
only-js = { path = ".." }
# 不带 test-support：测试夹具（含固定测试私钥）不得编进发行二进制。
server = { path = "../server" }
# 装配层直接持有插件 vtable 槽位类型（Registries.blob），需直接依赖契约 crate。
oj-plugin-ffi = { path = "../oj-plugin-ffi" }
serde = { version = "1", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tar = "0.4"
flate2 = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
# 测试框架（L1）：进程内 dispatch + 真实 deno_core 运行时内跑 TS 用例。
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
deno_core = "0.410"
deno_error = "0.7"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json"] }
tracing = "0.1"
# 迁移引擎（spec §11.2，D4）：零驱动 core（default-features=false），经 OjConn 适配器
# 复用 DataAccessor（方言 SQL 由根 crate 统一承担，refinery 只吃字符串）。
# time 为 refinery 账本 applied_on 解析所需（已在依赖树，显式声明防漂移）。
refinery-core = { version = "0.9", default-features = false, features = ["int8-versions"] }
time = "0.3"
# schema.yaml → DDL 生成（§4.7）：与根 crate 同为 1.0（依赖树单版本，构造器已用）。
sea-query = "1.0"
# S004 deps 版本范围匹配（§5.1）：refinery 已带入 1.0（依赖树零新增节点）。
semver = "1"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json"] }
# 正向用例签发测试 JWT，验证 oj-auth 守卫验签链路（与根 crate/插件同为 9，依赖树单版本）。
jsonwebtoken = "9"
# 测试装配需要生成真实签名 JWS 证书（证书必配、无逃生口后，测试必须自带有效证书）。
# dev-dep 之上追加 test-support：测试构建特性并入，发行构建不含 test_support 模块。
server = { path = "../server", features = ["test-support"] }
