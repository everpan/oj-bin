[package]
name = "server"
version = "0.1.0"
edition = "2024"

[features]
# test_support 模块仅随测试编译；oj 的 dev-deps 需经它装配测试证书。
test-support = []

[dependencies]
only-js = { path = ".." }
axum = { version = "0.8", features = ["ws"] }
matchit = "0.8"
percent-encoding = "2.3"
form_urlencoded = "1.2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "sync"] }
futures-util = "0.3.34"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
multer = "3"
ring = "0.17"
base64 = "0.21"
notify = "8"

# 终端镜像落盘（logging）：pipe/dup2 重定向 stdout/stderr。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
