[package]
name = "mdm-server"
version = "0.1.0"
edition = "2024"

[dependencies]
mdm-base-rust = { path = ".." }
axum = { version = "0.8", features = ["ws"] }
matchit = "0.8"
percent-encoding = "2.3"
form_urlencoded = "1.2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "sync"] }
futures-util = "0.3.34"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = "0.4"
jsonwebtoken = "9"
bcrypt = "0.15"
sha2 = "0.10"
getrandom = "0.2"
multer = "3"

[dev-dependencies]
serde_json = "1"
