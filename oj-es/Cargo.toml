[package]
name = "oj-es"
version = "0.1.0"
edition = "2024"
description = "es 轴 cdylib 插件：Elasticsearch HTTP 实现（迁自 core EsClient）"

[lib]
crate-type = ["cdylib"]

[dependencies]
oj-plugin-ffi = { path = "../oj-plugin-ffi" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "time"] }

[dev-dependencies]
httptest = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "time", "macros"] }
