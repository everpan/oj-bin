[package]
name = "oj-db-postgres"
version = "0.1.3"
edition = "2024"
description = "db 轴 postgres cdylib 插件：sqlx Any 单方言（postgres）迁移自 core SqlxAccessor"

[lib]
crate-type = ["cdylib"]

[dependencies]
oj-plugin-ffi = { path = "../../oj-plugin-ffi" }
serde_json = "1"
# ABI 10 流式游标：async-stream 持有自有 SQL/参数/池（规避 sqlx Query 借用 &str）
async-stream = "0.3"
futures = { version = "0.3", default-features = false, features = ["std"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "any",
    "postgres",
    "json",
    # v0.1.3（L6 / U-6）：读侧受限类型解码——NUMERIC → 十进制字符串、日期时间 →
    # ISO 8601、UUID → 文本、数组 → JSON 数组。`bigdecimal` 同时引入 num-bigint/num-traits。
    "chrono",
    "bigdecimal",
    "uuid",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "time"] }

[dev-dependencies]
# 离线全路径 roundtrip：dev 构建经 feature 统一给 sqlx Any 装 sqlite 驱动
# （install_default_drivers 按启用特性安装）——生产 cdylib 不受影响，仍单方言。
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "any", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "time", "macros"] }
