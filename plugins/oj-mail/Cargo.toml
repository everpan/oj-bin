[package]
name = "oj-mail"
version = "0.1.0"
edition = "2024"
description = "mail 轴：lettre SMTP 发送（连接池 + 有界队列/worker 池）"

[lib]
crate-type = ["cdylib"]

[dependencies]
oj-plugin-ffi = { path = "../../oj-plugin-ffi" }
# 方案 B（阶段 0 定稿，见 docs/plans/2026-09-15-mail-smtp-impl.md 阶段 0 小结 §1）：
# 不得用 rustls-tls / tokio1-rustls-tls —— 它们经 lettre 的 `ring = ["rustls?/ring"]`
# 强拉第二个 crypto provider，与框架 aws-lc-rs 冲突（运行期 ClientConfig::builder panic 面）。
# 显式 webpki-roots + rustls-no-provider + aws-lc-rs 与 rustls-tls 功能等价且 provider 同源。
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls",
    "rustls-no-provider",
    "webpki-roots",
    "aws-lc-rs",
    "hostname",
    "pool",
    "file-transport",
] }
# 与根 crate 同版本锁定（root Cargo.toml 亦为 =0.23.40），避免解析出第二份 rustls。
rustls = "=0.23.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
