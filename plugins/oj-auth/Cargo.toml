[package]
name = "oj-auth"
version = "0.1.0"
edition = "2024"
description = "auth 轴守卫 cdylib 插件：JWT 验签 + 匿名路径匹配（迁自 server/auth.rs）"

[lib]
crate-type = ["cdylib"]

[dependencies]
oj-plugin-ffi = { path = "../../oj-plugin-ffi" }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
