[workspace]
members = ["server", "oj", "oj-plugin-ffi", "plugins/oj-es", "plugins/oj-db-mysql", "plugins/oj-db-postgres", "plugins/oj-blob-s3", "plugins/oj-bus-kafka", "plugins/oj-bus-rabbitmq", "plugins/oj-kv-redis", "tools/xtask", "tools/oj-cert", "tests/plugins/mini"]
default-members = ["."]

[package]
name = "only-js"
version = "0.1.0"
edition = "2024"

# 无可选 feature：kafka/rabbitmq 事件 broker 已迁插件（Task 4.3，oj-bus-kafka /
# oj-bus-rabbitmq cdylib 各自携带 rdkafka/lapin 客户端，core 不再依赖）。

[dependencies]  
async-trait = "0.1"
base64 = "0.23.1"
deno_core = "0.410"
deno_error = "0.7"
libloading = "0.9.0"
oj-cert = { path = "tools/oj-cert" }
oj-plugin-ffi = { path = "oj-plugin-ffi" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json"] }
# cert.renew 在本 crate 内解析 PKCS#8 PEM（from_pkcs8_pem 需 pem feature）；
# 版本/feature 与 tools/oj-cert 对齐（workspace 统一解析为同一份 rsa）。
rsa = { version = "0.9", features = ["pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 0.9 已 deprecated 但功能完备；
serde_yaml = "0.9"
sea-query = "1.0"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "macros",
    "any",
    "sqlite",
    "json",
] }
notify = "8"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "net", "io-util", "time"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = "0.3"
deno_ast = { version = "0.53.3", features = ["transpiling"] }
object_store = { version = "0.14.1", features = ["aws"] }

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.2"
oj = { path = "oj" }
# test-support：复用 server::test_support 的测试证书夹具（全仓唯一定义，勿再拷贝密钥对）。
server = { path = "server", features = ["test-support"] }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "test-util"] }
httptest = "0.16"
tempfile = "3"

[[bench]]
name = "bridge"
harness = false

# 插件契约：所有 cdylib 插件必须 panic=unwind（oj_plugin_entry! 内建 catch_unwind
# 收敛跨界 panic；任何下游 profile 不得覆盖为 abort）。
[profile.release]
panic = "unwind"
