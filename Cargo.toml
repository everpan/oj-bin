[workspace]
members = ["server", "oj", "oj-plugin-ffi", "plugins/oj-es", "plugins/oj-db-mysql", "plugins/oj-db-postgres", "plugins/oj-blob-s3", "plugins/oj-bus-kafka", "plugins/oj-bus-rabbitmq", "plugins/oj-kv-redis", "plugins/oj-auth", "tools/xtask", "tools/oj-cert", "tests/plugins/mini", "tests/plugins/mini-kv", "tests/plugins/mini-mq", "tests/plugins/mini-nosym"]
default-members = ["."]

[package]
name = "only-js"
version = "0.1.2"
edition = "2024"

# 无可选 feature：kafka/rabbitmq 事件 broker 已迁插件（Task 4.3，oj-bus-kafka /
# oj-bus-rabbitmq cdylib 各自携带 rdkafka/lapin 客户端，core 不再依赖）。

[dependencies]  
async-trait = "0.1"
base64 = "0.23.1"
# jwt/bcrypt/crypto 原语（auth 解耦 Task 1：核心只留原语，业务语义在 JS/插件）。
bcrypt = "0.15"
deno_core = "0.411"
deno_error = "0.7"
# WS 客户端扩展面（v0.1.7）：deno_websocket 的 JS 经 core.loadExtScript 依赖
# deno_web/deno_webidl/deno_fetch/deno_net 的扩展 JS，须一并注册（见 bridge::ws_client_extensions）。
deno_web = "0.289"
deno_webidl = "0.258"
deno_fetch = "0.282"
deno_net = "0.250"
deno_websocket = "0.263"
deno_permissions = "0.117"
# 根证书（v0.1.8）：create_default_root_cert_store（webpki-roots）注入 deno_fetch
# Options.root_cert_store_provider，https fetch 与 wss 握手共用。
deno_tls = "0.245"
# 显式安装 rustls CryptoProvider（ws_client_extensions）：deno_tls 锁同一版本
rustls = "=0.23.40"
# RealSys 的 EnvHomeDir 由平台 feature 门控：unix 走 libc、windows 走 winapi
# （deno_permissions 的 RuntimePermissionDescriptorParser 需要它）。
sys_traits = { version = "0.1.28", features = ["libc", "real", "winapi"] }
getrandom = "0.2"
jsonwebtoken = "9"
libloading = "0.9.0"
oj-cert = { path = "tools/oj-cert" }
oj-plugin-ffi = { path = "oj-plugin-ffi" }
# cert.renew 在本 crate 内解析 PKCS#8 PEM（from_pkcs8_pem 需 pem feature）；
# 版本/feature 与 tools/oj-cert 对齐（workspace 统一解析为同一份 rsa）。
rsa = { version = "0.9", features = ["pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 0.9 已 deprecated 但功能完备；
serde_yaml = "0.9"
sea-query = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "macros",
    "any",
    "sqlite",
    "json",
] }
notify = "8"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "net", "io-util", "time"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = "0.3"
deno_ast = { version = "0.53.3", features = ["transpiling"] }
object_store = { version = "0.14.1", features = ["aws"] }

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.2"
oj = { path = "oj" }
# test-support：复用 server::test_support 的测试证书夹具（全仓唯一定义，勿再拷贝密钥对）。
server = { path = "server", features = ["test-support"] }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "test-util"] }
httptest = "0.16"
tempfile = "3"

[[bench]]
name = "bridge"
harness = false

# 插件契约：所有 cdylib 插件必须 panic=unwind（oj_plugin_entry! 内建 catch_unwind
# 收敛跨界 panic；任何下游 profile 不得覆盖为 abort）。
[profile.release]
panic = "unwind"

# 禁用 debug 产物（磁盘约束：deno 栈 dev 构建曾占 120G+）：无 debuginfo、无增量缓存。
# 测试/门禁仍可跑 dev profile，但常规验证一律 --release（见 CLAUDE.md 命令节）。
[profile.dev]
debug = false
incremental = false
