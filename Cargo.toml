[workspace]
members = ["server", "oj"]

[package]
name = "mdm-base-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
deno_core = "0.410"
deno_error = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 0.9 已 deprecated 但功能完备；
serde_yaml = "0.9"
sea-query = "1.0"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "macros",
    "any",
    "mysql",
    "postgres",
    "sqlite",
    "json",
] }
notify = "8"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "net", "io-util", "time"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = "0.3"
deno_ast = { version = "0.53.3", features = ["transpiling"] }

[dev-dependencies]
criterion = "0.5"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread"] }

[[bench]]
name = "bridge"
harness = false
