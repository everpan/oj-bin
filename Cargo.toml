[workspace]
members = ["server", "oj", "oj-plugin-ffi"]

[package]
name = "mdm-base-rust"
version = "0.1.0"
edition = "2024"

# 可选能力：分布式事件 broker（默认关闭，启用才拉取对应客户端依赖）。
# - kafka：rdkafka 需要系统 librdkafka（或改用 features=["tokio","cmake-build"] 源码编译，需 cmake+openssl）。
# - rabbitmq：lapin 纯 Rust，无原生依赖。
[features]
default = []
kafka = ["dep:rdkafka"]
rabbitmq = ["dep:lapin"]

[dependencies]
async-trait = "0.1"
deno_core = "0.410"
deno_error = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 0.9 已 deprecated 但功能完备；
serde_yaml = "0.9"
sea-query = "1.0"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "macros",
    "any",
    "mysql",
    "postgres",
    "sqlite",
    "json",
] }
notify = "8"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "net", "io-util", "time"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = "0.3"
deno_ast = { version = "0.53.3", features = ["transpiling"] }
object_store = { version = "0.11", features = ["aws"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
# 可选：分布式事件 broker 客户端（feature 启用）。
rdkafka = { version = "0.36", optional = true, features = ["tokio"] }
lapin = { version = "2", optional = true }

[dev-dependencies]
criterion = "0.5"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "test-util"] }
httptest = "0.16"

[[bench]]
name = "bridge"
harness = false
