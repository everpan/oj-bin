[workspace]
members = ["server", "oj", "oj-plugin-ffi", "plugins/oj-es", "plugins/oj-db-mysql", "plugins/oj-db-postgres", "plugins/oj-blob-s3", "plugins/oj-bus-kafka", "plugins/oj-bus-rabbitmq", "plugins/oj-kv-redis", "tools/xtask", "tests/plugins/mini"]
default-members = ["."]

[package]
name = "only-js"
version = "0.1.0"
edition = "2024"

# 无可选 feature：kafka/rabbitmq 事件 broker 已迁插件（Task 4.3，oj-bus-kafka /
# oj-bus-rabbitmq cdylib 各自携带 rdkafka/lapin 客户端，core 不再依赖）。

[dependencies]  
async-trait = "0.1"
base64 = "0.21"
deno_core = "0.410"
deno_error = "0.7"
libloading = "0.8"
oj-plugin-ffi = { path = "oj-plugin-ffi" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 0.9 已 deprecated 但功能完备；
serde_yaml = "0.9"
sea-query = "1.0"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "macros",
    "any",
    "sqlite",
    "json",
] }
notify = "8"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "net", "io-util", "time"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = "0.3"
deno_ast = { version = "0.53.3", features = ["transpiling"] }
object_store = { version = "0.11", features = ["aws"] }

[dev-dependencies]
criterion = "0.5"
rand = "0.8"
ring = "0.17"
oj = { path = "oj" }
server = { path = "server" }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "test-util"] }
httptest = "0.16"
tempfile = "3"

[[bench]]
name = "bridge"
harness = false

# 插件契约：所有 cdylib 插件必须 panic=unwind（oj_plugin_entry! 内建 catch_unwind
# 收敛跨界 panic；任何下游 profile 不得覆盖为 abort）。
[profile.release]
panic = "unwind"
